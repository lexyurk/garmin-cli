coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default:
        target: 90%
        threshold: 0%
    patch:
      default:
        target: 90%
        threshold: 0%

# Go treats a line as covered when any statement on it executes. Match that
# convention so Codecov's line badge and `go tool cover` agree on partial lines.
parsers:
  go:
    partials_as_hits: true
